  steps: |
    1. Structure the output with clear section headings (e.g., Introduction, Results, Conclusion).
    2. Use bullet points, numbered lists, and tables as appropriate.
    3. Avoid using features not supported by Word (e.g., advanced HTML/CSS).
  rules:
